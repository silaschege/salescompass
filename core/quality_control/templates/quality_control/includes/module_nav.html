<!-- Dashboard -->
<a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"

    <div class="d-flex align-items-center">
        <i class="bi bi-speedometer2 nav-icon"></i>
        <span>Dashboard</span>
    </div>
</a>

<!-- Inspection Rules -->

        <i class="bi bi-clipboard-check nav-icon"></i>
        <span>Inspection Rules</span>
    </div>
</a>
<div class="collapse {% if 'rule' in request.resolver_match.url_name %}show{% endif %}" id="rulesMenu">
    <a class="nav-link {% if 'rule_list' in request.resolver_match.url_name %}active{% endif %}"
        href="{% url 'quality_control:rule_list' %}">
        Rule Definitions
    </a>
    <a class="nav-link {% if 'library' in request.resolver_match.url_name %}active{% endif %}"
        href="{% url 'quality_control:library_list' %}">
        Check Library
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'rule_create' %}active{% endif %}"
        href="{% url 'quality_control:rule_create' %}">
        New Rule
    </a>
</div>

<!-- Inspection Logs -->

        <i class="bi bi-journal-text nav-icon"></i>
        <span>Inspection Logs</span>
    </div>
</a>
<div class="collapse {% if 'log' in request.resolver_match.url_name %}show{% endif %}" id="logsMenu">

</div>
