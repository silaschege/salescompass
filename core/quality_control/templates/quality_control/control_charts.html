{% extends "quality_control/base.html" %}

{% block page_content %}
<div class="row mb-4">
    <div class="col-12">
        <div class="card shadow">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-primary">Statistical Process Control (SPC) Charts</h6>
                <div class="col-md-4">
                    <select id="ruleSelect" class="form-select form-select-sm" onchange="loadChartData(this.value)">
                        <option value="">Select Inspection Rule...</option>
                        {% for rule in rules %}
                        <option value="{{ rule.id }}">{{ rule.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="card-body">
                <div id="chartContainer" style="height: 400px; position: relative;">
                    <canvas id="spcChart"></canvas>
                    <div id="noDataMessage" class="position-absolute top-50 start-50 translate-middle d-none">
                        <div class="text-center text-muted">
                            <i class="bi bi-graph-up-arrow display-4"></i>
                            <p>No numerical trend data available for this rule.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let myChart = null;

    async function loadChartData(ruleId) {
        if (!ruleId) return;

        const response = await fetch(`/quality-control/api/charts/data/?rule_id=${ruleId}`);
        const result = await response.json();

        const noDataMsg = document.getElementById('noDataMessage');
        const ctx = document.getElementById('spcChart');

        if (!result.data || result.data.length === 0) {
            noDataMsg.classList.remove('d-none');
            if (myChart) myChart.destroy();
            return;
        }

        noDataMsg.classList.add('d-none');

        const labels = result.data.map(p => p.date);
        const values = result.data.map(p => p.value);
        const meanLine = Array(labels.length).fill(result.stats.mean);
        const uclLine = Array(labels.length).fill(result.stats.ucl);
        const lclLine = Array(labels.length).fill(result.stats.lcl);

        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Measured Value',
                        data: values,
                        borderColor: '#6f42c1',
                        backgroundColor: 'rgba(111, 66, 193, 0.1)',
                        fill: false,
                        tension: 0.1
                    },
                    {
                        label: 'Mean',
                        data: meanLine,
                        borderColor: '#28a745',
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    },
                    {
                        label: 'UCL (Upper Limit)',
                        data: uclLine,
                        borderColor: '#dc3545',
                        borderDash: [2, 2],
                        pointRadius: 0,
                        fill: false
                    },
                    {
                        label: 'LCL (Lower Limit)',
                        data: lclLine,
                        borderColor: '#dc3545',
                        borderDash: [2, 2],
                        pointRadius: 0,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        title: { display: true, text: 'Metric Value' }
                    }
                }
            }
        });
    }

    // Pass rules from context if needed, but here we assume 'rules' is in context.
    // If RuleListView is not the one, Dashboard or specialized view should provide it.
</script>
{% endblock %}
