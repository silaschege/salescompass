{% extends "invoicing/base.html" %}

{% block invoicing_content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 3rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-3">Delete Invoice</h3>
                    <p class="text-muted mb-4">
                        Are you sure you want to delete invoice <strong>{{ object.invoice_number }}</strong>?
                        This action cannot be undone.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-block">
                            <button type="submit" class="btn btn-danger px-4 py-2 me-md-2 fw-bold">
                                Confirm Delete
                            </button>
                            <a href="{% url 'invoicing:invoice_detail' object.pk %}"
                                class="btn btn-light px-4 py-2 border fw-bold text-dark">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
