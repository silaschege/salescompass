{% extends "invoicing/base.html" %}

{% block invoicing_content %}
<div class="container-fluid py-4">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-5 text-center">
            <div class="bg-danger bg-opacity-10 d-inline-flex p-4 rounded-circle mb-4">
                <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
            </div>
            <h3 class="mb-3">Delete Debit Note</h3>
            <p class="text-muted mb-4">
                Are you sure you want to delete debit note
                <strong>{{ object.note_number }}</strong>
                for <strong>${{ object.amount|floatformat:2 }}</strong>
                against invoice <strong>{{ object.invoice.invoice_number }}</strong>?
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'invoicing:debit_note_list' %}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash me-2"></i>Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
