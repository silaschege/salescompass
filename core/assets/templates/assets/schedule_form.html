{% extends "assets/base.html" %}
{% load crispy_forms_tags %}

{% block asset_content %}
<div class="p-4">
    <div class="d-flex align-items-center mb-5">
        <a href="{% url 'assets:asset_detail' asset.pk %}"
            class="btn btn-light btn-icon rounded-circle me-3 border-0 shadow-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h1 class="h3 fw-bold mb-0">Preventive Maintenance Schedule</h1>
            <p class="text-muted mb-0">{{ asset.name }} ({{ asset.asset_number }})</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-6">
            <div class="premium-card p-4 border-0 shadow-sm">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-primary px-4 shadow-sm border-0">
                            Create Schedule
                        </button>
                        <a href="{% url 'assets:asset_detail' asset.pk %}"
                            class="btn btn-light px-4 border ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
