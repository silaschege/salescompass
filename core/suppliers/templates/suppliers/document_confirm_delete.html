{% extends "suppliers/base.html" %}
{% block title %}Delete Document - {{ object.name }}{% endblock %}

{% block module_content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="card-title mb-0">Confirm Deletion</h5>
            </div>
            <div class="card-body text-center p-4">
                <p class="mb-4">Are you sure you want to delete the document <strong>"{{ object.name }}"</strong>?</p>
                <p class="text-muted small mb-4">This action cannot be undone.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'suppliers:supplier_detail' object.supplier.pk %}"
                            class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Delete Document</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
