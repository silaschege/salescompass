{% extends 'expenses/base.html' %}
{% load humanize %}
{% load crispy_forms_tags %}

{% block expenses_content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{% url 'expenses:category_list' %}"
                class="btn btn-icon btn-light me-3 text-secondary shadow-sm rounded-circle"
                style="width: 40px; height: 40px;">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h4 class="mb-1 fw-bold text-dark">
                    {% if form.instance.pk %}Edit Category{% else %}New Expense Category{% endif %}
                </h4>
                <p class="text-muted mb-0">Define expense types and accounting rules.</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-save me-2"></i> Save Category
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
