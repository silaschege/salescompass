{% extends "accounting/base.html" %}

{% block accounting_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3">Exchange Rates</h1>
    <a href="{% url 'accounting:exchange_rate_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Record Rate
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="bg-light">
                <tr>
                    <th>From</th>
                    <th>To</th>
                    <th>Rate</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for rate in rates %}
                <tr>
                    <td>{{ rate.from_currency.code }}</td>
                    <td>{{ rate.to_currency.code }}</td>
                    <td>{{ rate.rate }}</td>
                    <td>{{ rate.date }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center py-5">No exchange rates found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
